name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wasp
          POSTGRES_PASSWORD: wasp
          POSTGRES_DB: wasp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wasp -d wasp"
          --health-interval 3s
          --health-retries 20
    env:
      WASP_DATABASE_URL: postgresql+psycopg://wasp:wasp@localhost:5432/wasp
      OMP_THREAD_LIMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Start S3 storage
        # Service containers can't take a command, so run SeaweedFS directly.
        run: >
          docker run -d -p 8333:8333
          -v ${{ github.workspace }}/infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
          chrislusf/seaweedfs:4.50
          server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
