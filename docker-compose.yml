x-backend-env: &backend-env
  WASP_DATABASE_URL: postgresql+psycopg://wasp:wasp@db:5432/wasp
  WASP_REDIS_URL: redis://redis:6379/0
  WASP_S3_ENDPOINT: http://storage:8333
  WASP_S3_ACCESS_KEY: wasp
  WASP_S3_SECRET_KEY: wasp-secret
  WASP_S3_BUCKET: wasp-documents
  # One OCR thread per process: the worker already runs many processes in parallel, and
  # Tesseract's own threading on top of that oversubscribes the CPU.
  OMP_THREAD_LIMIT: "1"
  WASP_JWT_SECRET: ${WASP_JWT_SECRET:-dev-only-insecure-secret-change-me-0000}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wasp
      POSTGRES_PASSWORD: wasp
      POSTGRES_DB: wasp
    # Only for host tools (psql, pgAdmin); the services reach the database as db:5432. Not 5432
    # or 5433, which a locally installed PostgreSQL often holds (the db container then fails to
    # start, or host clients silently reach that other server), and localhost only.
    ports: ["127.0.0.1:${WASP_DB_PORT:-15432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasp -d wasp"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible object storage (MinIO no longer publishes community images).
  storage:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  backend:
    build: ./backend
    image: wasp-backend:dev  # shared with the worker so both always run the same build
    environment:
      <<: *backend-env
      WATCHFILES_FORCE_POLLING: "true"  # file events don't cross Windows/macOS bind mounts
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [./backend:/app, ./data:/data, models:/models]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  worker:
    image: wasp-backend:dev
    environment: *backend-env
    # Bounded concurrency: each process holds OCR and (once a handbook is loaded) the
    # embedding model in memory; 4 keeps a demo laptop responsive.
    command: celery -A app.worker worker -Q default,documents,monitoring --concurrency 4 --loglevel=info
    volumes: [./backend:/app, ./data:/data, models:/models]
    depends_on:
      backend: { condition: service_started }

  # Scheduler: runs the monitoring scan periodically (expiring certificates, overdue responses).
  beat:
    image: wasp-backend:dev
    environment:
      <<: *backend-env
      WASP_MONITORING_INTERVAL_SECONDS: "300"  # every 5 minutes in dev
    command: celery -A app.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes: [./backend:/app]
    depends_on:
      backend: { condition: service_started }

  frontend:
    image: node:24-alpine
    working_dir: /app
    # Reinstall only when the lockfile changed, so restarts work offline (e.g. at the venue).
    command: >
      sh -c 'lock=$$(sha256sum package-lock.json);
             [ "$$(cat node_modules/.lock-sha 2>/dev/null)" = "$$lock" ] ||
               { npm ci && echo "$$lock" > node_modules/.lock-sha; };
             npm run dev -- --host 0.0.0.0'
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_USE_POLLING: "1"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      # Named (not anonymous) so installed packages survive container recreation, which
      # matters offline: the container can be recreated without reinstalling.
      - frontend_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      backend: { condition: service_started }

volumes:
  pgdata:
  storagedata:
  models:  # embedding model cache, downloaded once
  frontend_node_modules:
  npm_cache:
